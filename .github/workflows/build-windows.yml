# GitHub Actions：在 GitHub 提供的 Windows 云电脑上打包 .exe
name: Build Windows exe

on:
  workflow_dispatch:        # 在网页上点 "Run workflow" 按钮时运行

jobs:
  build:
    runs-on: windows-latest   # 借一台最新的 Windows 云电脑
    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 用 PyInstaller 打包成一个 exe 文件
        run: pyinstaller --onefile --windowed --name DesktopAgent gui.py

      - name: 上传打包结果，方便下载
        uses: actions/upload-artifact@v7
        with:
          name: DesktopAgent-windows
          path: dist/DesktopAgent.exe